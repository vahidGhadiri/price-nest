name: Client CI/CD

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "apps/client/**"
      - "packages/**"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"

  pull_request:
    paths:
      - "apps/client/**"
      - "packages/**"

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Client

    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'PRODUCTION' || github.ref_name == 'staging' && 'STAGING' || 'DEV' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn turbo run lint --filter=client

      - name: Type Check
        run: yarn turbo run typecheck --filter=client

      - name: Build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: 
          yarn turbo run build --filter=client

  docker:
    name: Build Docker Image

    needs: verify

    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'PRODUCTION' || github.ref_name == 'staging' && 'STAGING' || 'DEV' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build \
            --load \
            --build-arg NEXT_PUBLIC_BASE_URL="${{ vars.NEXT_PUBLIC_BASE_URL }}" \
            -f docker/client.Dockerfile \
            -t price-nest-client:${{ github.sha }} \
            .
    
  push:
    name: Push Docker Image

    needs: docker

    if: github.ref_name == 'staging' || github.ref_name == 'main'

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'PRODUCTION' || 'STAGING' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
          tags: |
            price-nest-client:${{ github.sha }}
            price-nest-client:${{ github.ref_name }}
  