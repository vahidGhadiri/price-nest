name: Client CI/CD

on:
  push:
    branches:
      - develop
      - release/*
      - stage
      - main
    paths:
      - "apps/client/**"
      - "packages/**"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"

  pull_request:
    paths:
      - "apps/client/**"
      - "packages/**"

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Client

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'PRODUCTION' || github.ref_name == 'stage' && 'STAGE' || 'DEV' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn turbo run lint --filter=client

      - name: Type Check
        run: yarn turbo run typecheck --filter=client

      - name: Build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: yarn turbo run build --filter=client


  docker:
    name: Build & Push Docker Image

    needs: verify

    if: >
    
      github.event_name == 'push' &&
      (
        startsWith(github.ref_name, 'release/') ||
        github.ref_name == 'stage' ||
        github.ref_name == 'main'
      )

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'PRODUCTION' || 'STAGE' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/price-nest-client
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}


      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile

          push: true

          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
